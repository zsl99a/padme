# LLM API 中转 一键部署栈
# 用法:
#   1. cp .env.example .env  并填好所有变量
#   2. docker compose up -d
#   3. 访问 http://<VPS_IP>:7000  进入 new-api 面板
#
# 涉及组件:
#   - new-api:  主面板,中转 / 计费 / 用户管理
#   - postgres: 持久化
#   - redis:    缓存 / 限流
#   - nginx:    反向代理 + TLS(可选,生产强烈建议)

version: "3.8"

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: newapi
    restart: always
    ports:
      - "7000:3000"
    environment:
      - SQL_DSN=postgres://newapi:${POSTGRES_PASSWORD}@postgres:5432/newapi?sslmode=disable
      - REDIS_CONN_STRING=redis://redis:6379
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLE=true
      - GENERATE_DEFAULT_TOKEN=false
    volumes:
      - ./data/new-api:/data
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: newapi-postgres
    restart: always
    environment:
      - POSTGRES_DB=newapi
      - POSTGRES_USER=newapi
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: newapi-redis
    restart: always
    volumes:
      - ./data/redis:/data

  nginx:
    image: nginx:alpine
    container_name: newapi-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - new-api
