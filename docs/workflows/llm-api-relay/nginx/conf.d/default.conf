# new-api 反代配置
# 自签证书路径:./certs/<domain>.crt
server {
    listen 80;
    server_name <你的域名>;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name <你的域名>;

    ssl_certificate     /etc/nginx/certs/<你的域名>.crt;
    ssl_certificate_key /etc/nginx/certs/<你的域名>.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    # 主面板
    location / {
        proxy_pass http://new-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 兼容
    location /v1/ {
        proxy_pass http://new-api:3000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # 状态页(对外)
    location /status {
        proxy_pass http://new-api:3000/status;
        allow all;
    }
}
